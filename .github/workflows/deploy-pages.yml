name: Verify & Deploy to Cloudflare Pages

# 2026-09-17 全面审计 D1：此前本工作流**只在 push: main 上跑 npm ci + build，零守卫、无 PR 触发**
# —— 全部 check:*/report:*/test:* 在合并路径上形同虚设。现改为：
#   · verify（阻断，push/PR/dispatch）→ 全套静态守卫（2026-09-28 起 check:fast 并行）+ 完整构建
#   · guards-can-fail（阻断，仅 PR/dispatch）→ 逐条跑守卫自检，证明「守卫自己会失败」
#   · deploy（仅 main）→ 复用 verify 的产物部署，不重复构建
#
# 2026-09-20 云端接手实测订正（重要，别再把它当红灯）：
#   线上**走的是方案 A —— Cloudflare Pages 的 Git 直连**（push 即构建，不需要任何 secrets）。
#   证据：线上 /admin 入口 JS 与本仓库同一提交的构建产物**逐字节相同**
#   （sha256 0183752f5dc80e814f0165b9… / 2,874,838 B），深层 chunk 也相同，
#   且响应头是 application/javascript（不是曾经担心的 text/html）。
#   ⇒ 下面的 deploy（**方案 B**）缺 secrets 时**不再报红**，改为「优雅跳过 + 说明原因」：
#     它原本每个 main run 都红一次，会**掩盖真红**。要启用方案 B，补这两个 secrets 即可：
#     仓库 Settings → Secrets and variables → Actions → CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 按 ref 分组：PR 的检查不会取消 main 的部署
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # 非敏感构建配置（可进前端包）
  VITE_DEEPSEEK_BASE_URL: ${{ secrets.VITE_DEEPSEEK_BASE_URL }}
  VITE_DEEPSEEK_MODEL: ${{ secrets.VITE_DEEPSEEK_MODEL }}
  VITE_AI_DEFAULT_PROVIDER: deepseek
  # ⚠️ 不要再注入 VITE_*_API_KEY：VITE_ 前缀会被内联进前端包公开发布。
  #    AI 密钥走服务端网关 /api/ai，请在 Cloudflare Pages → Settings →
  #    Environment variables 配置 DEEPSEEK_API_KEY / BAILIAN_API_KEY。

jobs:
  verify:
    name: 静态守卫 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --include=dev：runner 若预设 NODE_ENV=production，devDependencies 会被静默省略，
      # 导致 vite/@vitejs/plugin-vue 缺失、build 与 check:sfc-dev 直接报「找不到 vite」。
      - name: Install dependencies
        run: npm ci --include=dev

      # 2026-09-28 产品负责人拍板改用 check:fast：与 check:admin **同一份全套清单、同判据**，并行执行。
      #   · serialGuards（起 Chrome/vite 的守卫）走互斥通道；未登记者由 check:guards-coverage 静态拦截；
      #   · --retry-serial：并行失败的逐条串行复跑，串行仍失败才判红；串行通过的打 ::warning（并行冲突嫌疑）。
      #   · check:astro 的通过缓存在 CI 不生效（GitHub 注入 CI=true，且全新安装没有 node_modules/.cache）；
      #     下面再显式设 CHECK_ASTRO_NO_CACHE=1，双保险。
      - name: 静态守卫（check:fast = 全套并行）
        run: npm run check:fast
        env:
          CHECK_ASTRO_NO_CACHE: '1'

      - name: Build site (admin + astro)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  guards-can-fail:
    name: 守卫自检（证明会失败）
    # 只在 PR / 手动触发时跑：main 的部署链路保持轻快，但合并前必须证明守卫可信
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: 逐条守卫自检（注入回归 → 必须检出 → 还原源文件）
        run: npm run check:admin:selftest

  deploy:
    name: 部署到 Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # 先判定方案 B 是否可用（**判据是 secrets 是否存在**，不是"部署是否成功"）：
      #   configured=true  → 继续走下面的 wrangler 部署；
      #   configured=false → 后续步骤全部跳过，本 job **绿**并打一条 notice 说明原因。
      # 为什么必须这样：GitHub 不允许在 job/step 的 if 里直接读 secrets，只能先落到 env 再判。
      - name: 检查 Cloudflare secrets 是否已配置（方案 B 前置）
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Cloudflare secrets 已配置 → 执行 Actions 部署（方案 B）"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过 Actions 部署（方案 B 未配置）::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。线上走方案 A（Cloudflare Pages Git 直连），已实测线上产物与本提交构建逐字节相同，故不影响线上。如需启用方案 B：仓库 Settings → Secrets and variables → Actions 补这两个 secrets。"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: npm

      # 装依赖只为拿到与本地一致的 wrangler（devDependency）；构建产物用上面 verify 的 artifact
      - name: Install dependencies (for wrangler)
        if: steps.cf.outputs.configured == 'true'
        run: npm ci --include=dev

      - name: Download dist
        if: steps.cf.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shanchuan-zaowu-site --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
