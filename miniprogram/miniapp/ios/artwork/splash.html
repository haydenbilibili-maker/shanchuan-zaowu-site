<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>山海造物 Launch</title>
  <style>
    html, body {
      margin: 0;
      width: 1125px;
      height: 2436px;
      background: #FAFAF5;
      overflow: hidden;
    }
    .stage {
      width: 1125px;
      height: 2436px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding-bottom: 80px;
    }
    svg { width: 360px; height: 360px; display: block; }
    h1 {
      margin: 56px 0 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 84px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #2C2C2C;
      text-indent: 0.22em;
    }
    .en {
      margin-top: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      letter-spacing: 0.28em;
      color: #8B6F47;
      text-indent: 0.28em;
    }
    .tag {
      margin-top: 36px;
      font-family: "Songti SC", "STSong", serif;
      font-size: 30px;
      letter-spacing: 0.46em;
      color: #2D6A4F;
      text-indent: 0.46em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" rx="16" fill="#C4A76C"/>

        <rect x="30" y="80" width="10" height="50" stroke="none"/>

        <rect x="26" y="124" width="66" height="10" stroke="none"/>
        <circle cx="115" cy="60" r="6" stroke="none"/>
        <circle cx="113" cy="90" r="6" stroke="none"/>
        <path d="M107 140 L121 112" stroke-width="9" fill="none"/>
        <path d="M131 52 L172 52" stroke-width="8" fill="none"/>
        <path d="M131 44 L138 58" stroke-width="7" fill="none"/>
        <rect x="138" y="70" width="30" height="68" fill="none" stroke-width="8"/>
        <path d="M128 104 L178 104" stroke-width="8" fill="none"/>
        <circle cx="153" cy="87" r="4" stroke="none"/>
        <circle cx="153" cy="121" r="4" stroke="none"/>
      </g>
      <rect x="18" y="18" width="164" height="164" rx="4" fill="none" stroke="#4C6971" stroke-width="1.6"/>

    <h1>山海造物</h1>
    <div class="en">NATURE'S CREATIONS</div>
    <div class="tag">把山海带回家</div>

</html>
